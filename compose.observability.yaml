services:
  web:
    environment:
      Telemetry__Enabled: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://collector:4317'
      OTEL_METRIC_EXPORT_INTERVAL: '5000'
  collector:
    image: otel/opentelemetry-collector-contrib:0.137.0@sha256:886722fe0f37af9d1fe24d29529253ec59fbf263b3b1df4facaf221373e19d23
    command: ['--config=/etc/dockflow/collector.yaml']
    volumes:
      - ./ops/observability/collector.yaml:/etc/dockflow/collector.yaml:ro
  prometheus:
    image: prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=24h']
    volumes:
      - ./ops/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports: ['127.0.0.1:5194:9090']
  grafana:
    image: grafana/grafana:12.3.1@sha256:2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:5193:3000']
